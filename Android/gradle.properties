# 4g was the template's number and nothing here needs it: debug assemble times
# are flat from 4g down to 2g, and R8 — the heaviest consumer — completes at 2g
# too. Most of the daemon's RSS is non-heap anyway.
org.gradle.jvmargs=-Xmx2g

# Uncapped, the Kotlin daemon inherits the Gradle daemon's -Xmx. It peaks around
# 960 MB here, and there is regularly more than one of them alive.
kotlin.daemon.jvmargs=-Xmx2g

# Gradle keeps an idle daemon for 3 hours by default, which is what makes a
# second worktree expensive when only one of them is building. 30 minutes costs
# one daemon restart between sessions and frees the heap in between.
org.gradle.daemon.idletimeout=1800000

android.useAndroidX=true
kotlin.code.style=official
