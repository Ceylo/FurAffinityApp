name: Create Release
on:
  push:
    tags:
      - '*'
  workflow_dispatch:

# Three jobs: the IPA, the APK, and the draft release that takes both. The release
# job runs for a tag only, so `workflow_dispatch` on a branch is a full dry run —
# both artifacts built and checked, symbols uploaded to Sentry, no release.
jobs:
  ios:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Install the Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APP_PP_BASE64: ${{ secrets.APP_PP_BASE64 }}
          NOTIFICATION_CONTENT_EXT_PP_BASE64: ${{ secrets.NOTIFICATION_CONTENT_EXT_PP_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          PROVISIONINGPROFILE_STORAGE_PATH="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "${PROVISIONINGPROFILE_STORAGE_PATH}"

          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          APP_PROVISIONINGPROFILE_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate and provisioning profile from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$APP_PP_BASE64" | base64 --decode -o "${PROVISIONINGPROFILE_STORAGE_PATH}/app.mobileprovision"
          echo -n "$NOTIFICATION_CONTENT_EXT_PP_BASE64" | base64 --decode -o "${PROVISIONINGPROFILE_STORAGE_PATH}/notification-content-ext.mobileprovision"
          sha256 "${PROVISIONINGPROFILE_STORAGE_PATH}"/*.mobileprovision "${CERTIFICATE_PATH}"
          KEYCHAIN_PASSWORD_HASH=$(echo -n "${KEYCHAIN_PASSWORD}" | sha256)
          P12_PASSWORD_HASH=$(echo -n "${P12_PASSWORD}" | sha256)
          echo "SHA256 (KEYCHAIN_PASSWORD) = ${KEYCHAIN_PASSWORD_HASH}"
          echo "SHA256 (P12_PASSWORD) = ${P12_PASSWORD_HASH}"

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
      - name: Update Secrets
        env:
          AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          sed -i "" "s/amplitudeApiKey = \"Your App Secret\"/amplitudeApiKey = \"${AMPLITUDE_API_KEY}\"/" "FurAffinity/Secrets.swift"
          sed -i "" "s#static let sentryDSN = \"Your Sentry DSN\"#static let sentryDSN = \"${SENTRY_DSN}\"#" "FurAffinity/Secrets.swift"
          sed -i "" "s/PRODUCT_BUNDLE_IDENTIFIER = com.example.id1234;/PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};/" "FurAffinity.xcodeproj/project.pbxproj"
          AMPLITUDE_API_KEY_HASH=$(echo -n "${AMPLITUDE_API_KEY}" | sha256)
          BUNDLE_ID_HASH=$(echo -n "${BUNDLE_ID}" | sha256)
          echo "SHA256 (BUNDLE_ID) = ${BUNDLE_ID_HASH}"
          echo "SHA256 (AMPLITUDE_API_KEY) = ${AMPLITUDE_API_KEY_HASH}"
      - uses: mxcl/xcodebuild@v3
        with:
          action: none
          xcode: ~26.5
      - name: Install sentry-cli
        run: |
          # The archive's "Upload dSYMs" target needs it, and fails
          # the archive if it is missing.
          brew install getsentry/tools/sentry-cli
      - name: Trust package plugins and macros
        run: Scripts/iOS/trust-swiftpm-extensions.sh
      - name: Archive App
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          # A release whose dSYMs never reached Sentry reports crashes as bare
          # addresses, and the archive is gone by the time anyone notices. The
          # upload itself is the archive-only "Upload dSYMs" target, shared
          # with a local Xcode archive.
          [ -n "${SENTRY_AUTH_TOKEN}" ] || { echo "::error::SENTRY_AUTH_TOKEN is not set"; exit 1; }
          git_hash=$(git rev-parse --short "$GITHUB_SHA")
          fsfriendly_git_ref=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          qualified_app_name="FurAffinity-${fsfriendly_git_ref}-${git_hash}"
          archive_path=$(pwd)/${qualified_app_name}.xcarchive
          xcodebuild -disableAutomaticPackageResolution -scheme FurAffinity -destination generic/platform=iOS -configuration Release archive -archivePath "${archive_path}"
          mkdir Payload
          cp -Rp ${archive_path}/Products/Applications/* Payload/
          zip -rq "${qualified_app_name}.ipa" Payload
          zip -rq "${qualified_app_name}.xcarchive.zip" "${qualified_app_name}.xcarchive"
      - name: Check the app's dSYM carries debug info
        run: |
          # Local only: whether the upload reached Sentry is the archive's upload
          # target's exit status. `check` wants the DWARF file, not the bundle
          # around it, and passes anything it can read — a dSYM holding just a
          # symbol table included — so assert the `debug` feature itself.
          set -o pipefail
          dwarf=$(ls -d ./*.xcarchive)/"dSYMs/Fur Affinity.app.dSYM/Contents/Resources/DWARF/Fur Affinity"
          sentry-cli debug-files check --json "${dwarf}" | jq -e '.features | contains("debug")' > /dev/null \
            || { echo "::error::the app's dSYM carries no debug info"; exit 1; }
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: IPA
          path: FurAffinity-*.ipa
          if-no-files-found: error
      - name: Upload xcarchive
        uses: actions/upload-artifact@v4
        with:
          name: Xcode Archive
          path: ./*.xcarchive.zip
          if-no-files-found: error

  android:
    # arm64: no emulator here, so the Intel runner build.yml needs is not. If the
    # release SkipUI compile runs out of memory on this 7 GB runner, macos-26-intel
    # (14 GB) is the fallback until GitHub retires it around August 2027.
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Update Secrets
        env:
          AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          # The same values as the IPA's. Skip.env's bundle id becomes the
          # applicationId; build-release-apk.sh refuses the placeholder and an empty DSN.
          sed -i "" "s/amplitudeApiKey = \"Your App Secret\"/amplitudeApiKey = \"${AMPLITUDE_API_KEY}\"/" "FurAffinity/Secrets.swift"
          sed -i "" "s#static let sentryDSN = \"Your Sentry DSN\"#static let sentryDSN = \"${SENTRY_DSN}\"#" "FurAffinity/Secrets.swift"
          sed -i "" "s/^PRODUCT_BUNDLE_IDENTIFIER = com.example.id1234$/PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID}/" Skip.env
          AMPLITUDE_API_KEY_HASH=$(echo -n "${AMPLITUDE_API_KEY}" | sha256)
          BUNDLE_ID_HASH=$(echo -n "${BUNDLE_ID}" | sha256)
          echo "SHA256 (BUNDLE_ID) = ${BUNDLE_ID_HASH}"
          echo "SHA256 (AMPLITUDE_API_KEY) = ${AMPLITUDE_API_KEY_HASH}"
      - name: Install the signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: |
          # Without them the release is signed with the debug key, which can never
          # be replaced once shipped; build-release-apk.sh --ci fails instead.
          [ -n "${ANDROID_KEYSTORE_BASE64}" ] || { echo "::error::ANDROID_KEYSTORE_BASE64 is not set"; exit 1; }
          [ -n "${ANDROID_KEYSTORE_PROPERTIES}" ] || { echo "::error::ANDROID_KEYSTORE_PROPERTIES is not set"; exit 1; }
          echo -n "${ANDROID_KEYSTORE_BASE64}" | base64 --decode -o Android/app/keystore.jks
          printf '%s\n' "${ANDROID_KEYSTORE_PROPERTIES}" > Android/app/keystore.properties
          sha256 Android/app/keystore.jks
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Gradle's user home (dependencies, wrapper) cached across runs.
      - uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: on-failure
      - name: Cache SwiftPM repositories
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm/repositories
          key: swiftpm-repositories-${{ hashFiles('Package.resolved', '**/Package.swift') }}
          restore-keys: swiftpm-repositories-
      - name: Set up Skip
        # Not skiptools/actions/setup-skip: its Homebrew install compiles from
        # source on Intel. See the script's header.
        run: Scripts/Android/ci-setup.sh
      - name: Install the NDK
        run: |
          # Stripping the release .so files needs it; without it the APK is 2.5x
          # too big, and build-release-apk.sh --ci fails.
          NDK_VERSION=28.2.13676358
          if [ ! -d "${ANDROID_HOME}/ndk/${NDK_VERSION}" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" > /dev/null
          fi
          ls "${ANDROID_HOME}/ndk"
      - name: Build APK
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          # The Sentry Gradle plugin uploads the R8 mapping and the .so files during
          # the build; the script refuses to start without the token.
          set -o pipefail
          Scripts/Android/build-release-apk.sh --ci --out . 2>&1 | tee AndroidBuildLogs.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: FurAffinity-*.apk
          if-no-files-found: error
      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android Build Logs
          path: AndroidBuildLogs.txt
          if-no-files-found: warn

  release:
    needs: [ios, android]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create Release
        uses: ncipollo/release-action@v1
        id: create_release
        with:
          name: FurAffinity ${{ github.ref_name }}
          artifacts: assets/FurAffinity-*.ipa,assets/*.xcarchive.zip,assets/FurAffinity-*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          artifactErrorsFailBuild: true
          draft: true
