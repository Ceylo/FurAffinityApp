name: Build App
on: [push, workflow_dispatch]
# A newer push to the same branch supersedes a run still going: the Android job
# holds an Intel runner for up to an hour.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  Build-App:
    runs-on: macos-26
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Install the Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APP_PP_BASE64: ${{ secrets.APP_PP_BASE64 }}
          NOTIFICATION_CONTENT_EXT_PP_BASE64: ${{ secrets.NOTIFICATION_CONTENT_EXT_PP_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          PROVISIONINGPROFILE_STORAGE_PATH="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "${PROVISIONINGPROFILE_STORAGE_PATH}"

          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          APP_PROVISIONINGPROFILE_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate and provisioning profile from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$APP_PP_BASE64" | base64 --decode -o "${PROVISIONINGPROFILE_STORAGE_PATH}/app.mobileprovision"
          echo -n "$NOTIFICATION_CONTENT_EXT_PP_BASE64" | base64 --decode -o "${PROVISIONINGPROFILE_STORAGE_PATH}/notification-content-ext.mobileprovision"
          sha256 "${PROVISIONINGPROFILE_STORAGE_PATH}"/*.mobileprovision "${CERTIFICATE_PATH}"
          KEYCHAIN_PASSWORD_HASH=$(echo -n "${KEYCHAIN_PASSWORD}" | sha256)
          P12_PASSWORD_HASH=$(echo -n "${P12_PASSWORD}" | sha256)
          echo "SHA256 (KEYCHAIN_PASSWORD) = ${KEYCHAIN_PASSWORD_HASH}"
          echo "SHA256 (P12_PASSWORD) = ${P12_PASSWORD_HASH}"

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
      - name: Update Secrets
        env:
          AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
        run: |
          sed -i "" "s/amplitudeApiKey = \"Your App Secret\"/amplitudeApiKey = \"${AMPLITUDE_API_KEY}\"/" "FurAffinity/Secrets.swift"
          sed -i "" "s/PRODUCT_BUNDLE_IDENTIFIER = com.example.id1234;/PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};/" "FurAffinity.xcodeproj/project.pbxproj"
          AMPLITUDE_API_KEY_HASH=$(echo -n "${AMPLITUDE_API_KEY}" | sha256)
          BUNDLE_ID_HASH=$(echo -n "${BUNDLE_ID}" | sha256)
          echo "SHA256 (BUNDLE_ID) = ${BUNDLE_ID_HASH}"
          echo "SHA256 (AMPLITUDE_API_KEY) = ${AMPLITUDE_API_KEY_HASH}"
      - uses: mxcl/xcodebuild@v3
        with:
          action: none
          xcode: ~26.5
      - name: Trust package plugins and macros
        run: Scripts/iOS/trust-swiftpm-extensions.sh
      - name: Build App
        run: |
          NSUnbufferedIO=YES set -o pipefail && xcodebuild -disableAutomaticPackageResolution -scheme FurAffinity -destination 'platform=iOS Simulator,name=iPhone 17' -configuration Debug build 2>&1 | tee BuildLogs.txt | xcbeautify
      - name: Run Tests
        run: |
          git_hash=$(git rev-parse --short "$GITHUB_SHA")
          fsfriendly_git_ref=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          qualified_app_name="FurAffinity-${fsfriendly_git_ref}-${git_hash}"
          results_path=$(pwd)/${qualified_app_name}.xcresult
          NSUnbufferedIO=YES set -o pipefail && xcodebuild -disableAutomaticPackageResolution -scheme FurAffinity -destination 'platform=iOS Simulator,name=iPhone 17' -resultBundlePath "${results_path}" test 2>&1 | tee TestLogs.txt | xcbeautify
          zip -rq "${qualified_app_name}.xcresult.zip" "${qualified_app_name}.xcresult"
      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xcode Logs
          path: ./*Logs.txt
          if-no-files-found: error
      - name: Upload Tests Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xcode Test Results
          path: ./*.xcresult
          if-no-files-found: error
  Build-Android:
    # Intel, because the emulator needs nested virtualisation, which GitHub's arm64
    # macOS runners lack. GitHub retires its Intel macOS runners around August 2027;
    # see Android/docs/build-and-run.md § CI for the way off them.
    runs-on: macos-26-intel
    timeout-minutes: 150
    env:
      # AVD cache key and emulator image, kept in one place.
      EMULATOR_API_LEVEL: 34
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Gradle's user home (dependencies, wrapper) cached across runs.
      - uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: on-failure
      - name: Cache SwiftPM repositories
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm/repositories
          key: swiftpm-repositories-${{ runner.arch }}-${{ hashFiles('Package.resolved', '**/Package.swift') }}
          restore-keys: swiftpm-repositories-${{ runner.arch }}-
      - name: Set up Skip
        # Not skiptools/actions/setup-skip: its Homebrew install compiles from
        # source on Intel. See the script's header.
        run: Scripts/Android/ci-setup.sh
      - name: Build App
        # A green `skip android test` does not prove the app builds: only a Gradle
        # build compiles the Darwin bridge and the Kotlin. x86_64 alone, the
        # emulator's ABI.
        run: |
          set -o pipefail
          cd Android && SKIP_EXPORT_ARCHS=x86_64 ./gradlew :app:assembleDebug 2>&1 | tee ../AndroidBuildLogs.txt
      - name: Check shared globals
        run: ABI=x86_64 Scripts/Android/check-shared-globals.sh debug
      - name: Cache the emulator snapshot
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.EMULATOR_API_LEVEL }}-x86_64-${{ runner.os }}
      - name: Generate the emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          arch: x86_64
          ram-size: 4096M
          disk-size: 4096M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching"
      - name: Run Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          arch: x86_64
          ram-size: 4096M
          disk-size: 4096M
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Fails on a failing case and on a run below its case-count floor.
          script: Scripts/Android/test.sh --log-dir android-test-logs
      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android Logs
          path: |
            AndroidBuildLogs.txt
            android-test-logs/
          if-no-files-found: warn
